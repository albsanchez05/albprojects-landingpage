<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Alberto Sánchez</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/wse-style.css}">
</head>
<body class="wse-section-bg d-flex align-items-center min-vh-100">
<main class="container px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="wse-card bg-white p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill fs-1 text-forest-green"></i>
                    <h1 class="h3 fw-bold text-woodland-dark mt-2">Tutor Admin Panel</h1>
                    <p class="text-muted mb-0">Sign in to view student inquiries.</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    You have been signed out.
                </div>

                <form th:action="@{/admin/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-wse-primary w-100">Sign in</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
