<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Language Lessons</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Header / Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" th:text="${navBack}">← Back</a>
    </div>
</nav>

<!-- Hero Banner -->
<div class="bg-primary text-white text-center py-5 mb-5">
    <div class="container">
        <h1 class="display-5 fw-bold" th:text="${pageTitle}">Courses</h1>
        <p class="lead" th:text="${bannerSubtitle}">Course overview</p>
    </div>
</div>

<!-- Course Cards Grid -->
<div class="container mb-5">
    <h2 class="fw-bold mb-4 text-center" th:text="${packagesHeader}">Available Packages</h2>

    <div class="row g-4 justify-content-center">
        <div class="col-md-6 col-lg-5" th:each="pkg : ${packages}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex flex-column">
                    <h3 class="card-title h4 text-primary fw-bold" th:text="${pkg.title}">Package Title</h3>
                    <p class="card-text text-muted flex-grow-1" th:text="${pkg.description}">Description</p>
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                        <span class="fs-4 fw-bold text-dark" th:text="'€' + ${pkg.hourlyRate} + ${rateSuffix}">€25 / hr</span>
                        <a th:href="@{/contact(lang=${targetLanguage})}" class="btn btn-outline-primary fw-semibold" th:text="${contactBtnText}">
                            Contact
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- General CTA Section -->
    <div class="text-center mt-5 pt-4">
        <h3 class="fw-bold" th:text="${ctaTitle}">Ready to start learning?</h3>
        <p class="text-muted" th:text="${ctaSubtitle}">Get in touch to discuss schedule availability.</p>
        <a th:href="@{/contact(lang=${targetLanguage})}" class="btn btn-success btn-lg px-4 py-2 shadow-sm fw-bold" th:text="${ctaBtnText}">
            Contact for Availability
        </a>
    </div>
</div>

</body>
</html>
