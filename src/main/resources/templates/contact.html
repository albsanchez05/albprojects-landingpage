<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle}">Contact & Lesson Availability</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{${isEnglishCourse} ? '/learn-english' : '/learn-spanish'}" th:text="${navBack}">← Back</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <!-- Success Alert Banner -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
                <span th:text="${successMessage}">Success message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="card-title fw-bold text-center text-primary mb-3" th:text="${formTitle}">Contact Title</h2>
                    <p class="text-center text-muted mb-4" th:text="${formSubtitle}">Form Subtitle</p>

                    <form th:action="@{/contact}" th:object="${inquiry}" method="post">

                        <!-- Student Name -->
                        <div class="mb-3">
                            <label for="studentName" class="form-label fw-semibold" th:text="${labelName}">Your Name</label>
                            <input type="text" id="studentName" th:field="*{studentName}"
                                   class="form-control" th:classappend="${#fields.hasErrors('studentName')} ? 'is-invalid'"
                                   th:placeholder="${placeholderName}">
                            <div class="invalid-feedback" th:errors="*{studentName}">Name error</div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold" th:text="${labelEmail}">Email Address</label>
                            <input type="email" id="email" th:field="*{email}"
                                   class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   th:placeholder="${placeholderEmail}">
                            <div class="invalid-feedback" th:errors="*{email}">Email error</div>
                        </div>

                        <!-- Phone Number -->
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label fw-semibold" th:text="${labelPhone}">Mobile / Phone Number</label>
                            <input type="text" id="phoneNumber" th:field="*{phoneNumber}"
                                   class="form-control" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                                   th:placeholder="${placeholderPhone}">
                            <div class="invalid-feedback" th:errors="*{phoneNumber}">Phone error</div>
                        </div>

                        <!-- Target Language -->
                        <div class="mb-3">
                            <label for="targetLanguage" class="form-label fw-semibold" th:text="${labelLanguage}">Language You Want to Learn</label>
                            <select id="targetLanguage" th:field="*{targetLanguage}" class="form-select">
                                <option value="ENGLISH">English (Inglés)</option>
                                <option value="SPANISH">Spanish (Español)</option>
                            </select>
                        </div>

                        <!-- Message -->
                        <div class="mb-4">
                            <label for="message" class="form-label fw-semibold" th:text="${labelMessage}">Your Message / Goals</label>
                            <textarea id="message" th:field="*{message}" rows="4"
                                      class="form-control" th:classappend="${#fields.hasErrors('message')} ? 'is-invalid'"
                                      th:placeholder="${placeholderMessage}"></textarea>
                            <div class="invalid-feedback" th:errors="*{message}">Message error</div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold" th:text="${submitBtnText}">Send Inquiry</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
