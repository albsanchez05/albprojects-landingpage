spring.application.name=language-tutor-website

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/languagedb
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# 'update' automatically creates or updates tables matching your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Disable Open Session in View warning
spring.jpa.open-in-view=false